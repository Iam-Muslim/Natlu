name: the_great_quran
description: "The Great Quran — Real-time recitation tracker"
publish_to: 'none'
version: 1.0.2+15

environment:
  sdk: ^3.11.5

dependencies:
  audio_session: ^0.2.4

  flutter:
    sdk: flutter
  flutter_displaymode: ^0.7.0
  in_app_update: ^5.0.0

  path_provider: ^2.1.5
  permission_handler: ^13.0.1
  record: ^7.1.1

  share_plus: ^13.1.0
  shared_preferences: ^2.2.0
  sherpa_onnx: ^1.13.5
  super_sliver_list: ^0.4.1
  wakelock_plus: ^1.6.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/model/zipformer_p_arabic_v3.int8.onnx
    - assets/model/tokens.txt
    - assets/model/ordered_quran_phonemes.json
    - assets/model/ph_index.npy
    - assets/model/ref_norm_ph.txt
    - assets/icon/app_icon.png


  fonts:
    - family: HafsSmart
      fonts:
        - asset: assets/fonts/HafsSmart_08.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
