<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Recite Quran">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Recite Quran - اتلو القران</title>
  <link rel="manifest" href="manifest.json">
  <script src="coi-serviceworker.min.js"></script>
  <style>
    /* Modern Splash Screen Styles */
    #splash-overlay {
      position: fixed;
      inset: 0;
      background: #fdfaf6; /* Matches React landing page */
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      transition: opacity 0.5s ease;
    }
    .splash-card {
      background: white;
      padding: 2.25rem 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.08), 0 8px 10px -6px rgb(0 0 0 / 0.04);
      max-width: 25rem;
      width: 90%;
      text-align: center;
      border: 1px solid #f3f4f6;
    }
    .splash-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 1.25rem auto;
    }
    .splash-title-ar {
      font-size: 1.3rem;
      font-weight: 800;
      color: #171717;
      margin-bottom: 0.15rem;
      direction: rtl;
    }
    .splash-title-en {
      font-size: 0.95rem;
      font-weight: 700;
      color: #6b7280;
      margin-bottom: 0.85rem;
    }
    .splash-desc-ar {
      font-size: 0.9rem;
      color: #374151;
      margin-bottom: 0.4rem;
      line-height: 1.6;
      direction: rtl;
    }
    .splash-desc-en {
      font-size: 0.8rem;
      color: #6b7280;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .desc-divider {
      height: 1px;
      background: #f3f4f6;
      margin: 0.6rem auto;
      width: 50%;
    }
    .splash-btn {
      background: #059669; /* Emerald 600 */
      color: white;
      border: none;
      padding: 0.875rem 1.5rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 4px 6px -1px rgb(5 150 105 / 0.2);
    }
    .splash-btn:hover { background: #047857; transform: scale(1.02); }
    
    /* Progress Bar */
    #progress-container {
      display: none;
      width: 100%;
    }
    .progress-bar-bg {
      width: 100%;
      height: 0.75rem;
      background: #ecfdf5;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }
    #progress-bar-fill {
      height: 100%;
      background: #059669;
      width: 0%;
      transition: width 0.1s linear;
    }
    #progress-text {
      font-size: 0.85rem;
      color: #059669;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="splash-overlay">
    <div class="splash-card">
      <img src="icons/Icon-192.png" alt="Recite Quran" class="splash-icon" onerror="this.onerror=null; this.src='/app_icon.png';" />
      
      <div id="prompt-section">
        <h2 class="splash-title-ar">جارٍ التحميل...</h2>
        <div class="splash-title-en">Loading...</div>
        <p class="splash-desc-ar">يرجى الانتظار بينما يتم تجهيز التطبيق...</p>
        <div class="desc-divider"></div>
        <p class="splash-desc-en">Please wait while the app prepares...</p>
        <button id="accept-download-btn" class="splash-btn" style="display: none;">موافق • Accept</button>
      </div>

      <div id="progress-container">
        <h2 class="splash-title-ar">جارٍ التحميل...</h2>
        <div class="splash-title-en">Loading...</div>
        <p class="splash-desc-ar" style="margin-bottom: 0.25rem;">يرجى عدم إغلاق هذه الصفحة.</p>
        <p class="splash-desc-en" style="margin-bottom: 1rem;">Please do not close this tab.</p>
        <div class="progress-bar-bg">
          <div id="progress-bar-fill"></div>
        </div>
        <div id="progress-text">0%</div>
      </div>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="sherpa-onnx-asr.js?v=2"></script>
  <script src="sherpa_official_app.js?v=2"></script>
  <script src="sherpa-onnx-wasm-main-asr.js?v=2"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
