  <style>
    /* Minimal Instant Launch Screen */
    #splash-overlay {
      position: fixed;
      inset: 0;
      background: #fdfaf6;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      transition: opacity 0.35s ease;
      pointer-events: auto;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .splash-icon {
      width: 76px;
      height: 76px;
      border-radius: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 10px 25px -5px rgb(5 150 105 / 0.25);
    }
    .splash-title-ar {
      font-size: 1.35rem;
      font-weight: 800;
      color: #171717;
      margin: 0 0 0.2rem 0;
      direction: rtl;
    }
    .splash-title-en {
      font-size: 0.85rem;
      font-weight: 600;
      color: #9ca3af;
      margin: 0 0 1.5rem 0;
    }
    .splash-spinner {
      width: 26px;
      height: 26px;
      border: 2.5px solid #e5e7eb;
      border-top-color: #059669;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* PWA Banner */
    .pwa-banner {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 2rem);
      max-width: 28rem;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      border: 1px solid #e5e7eb;
      border-radius: 1.25rem;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.12);
      padding: 0.85rem 1.15rem;
      z-index: 2147483647;
      animation: pwaSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pwaSlideUp {
      from { transform: translate(-50%, 100%); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .pwa-banner-content {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .pwa-icon {
      width: 40px;
      height: 40px;
      border-radius: 0.65rem;
      flex-shrink: 0;
    }
    .pwa-text {
      flex: 1;
      text-align: right;
      direction: rtl;
    }
    .pwa-title-ar {
      font-size: 0.875rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.1rem;
    }
    .pwa-subtitle {
      font-size: 0.75rem;
      color: #4b5563;
      line-height: 1.3;
    }
    .pwa-subtitle-en {
      font-size: 0.675rem;
      color: #9ca3af;
      direction: ltr;
      text-align: left;
      margin-top: 0.1rem;
    }
    .pwa-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }
    .pwa-btn {
      background: #059669;
      color: white;
      border: none;
      border-radius: 9999px;
      font-weight: 700;
      cursor: pointer;
      padding: 0.5rem 0.85rem;
      font-size: 0.8rem;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .pwa-btn:hover { background: #047857; }
    .pwa-close-btn {
      background: transparent;
      border: none;
      color: #9ca3af;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.25rem;
      line-height: 1;
    }
    .pwa-close-btn:hover { color: #374151; }
  </style>

  <script>
    window.clearAppCacheAndReload = async function() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) await reg.unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) await caches.delete(k);
        }
      } catch (_) {}
      window.location.reload(true);
    };

    window.hideAppSplash = function() {
      const splash = document.getElementById('splash-overlay');
      if (splash && splash.style.display !== 'none') {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function() { splash.remove(); }, 350);
      }
    };

    // Auto-hide when Flutter paints its first frame
    window.addEventListener('flutter-first-frame', function() {
      window.hideAppSplash();
    });

    // Fallback: Observe Flutter elements entering DOM
    const observer = new MutationObserver(function() {
      if (document.querySelector('flutter-view, flt-glass-pane')) {
        setTimeout(window.hideAppSplash, 100);
        observer.disconnect();
      }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });

    // Graceful recovery if Flutter takes unusually long or encounters a stale cache block
    setTimeout(function() {
      const splash = document.getElementById('splash-overlay');
      if (splash && !document.querySelector('flutter-view, flt-glass-pane')) {
        const spinner = document.querySelector('.splash-spinner');
        if (spinner) spinner.style.display = 'none';
        let errBox = document.getElementById('splash-retry-box');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'splash-retry-box';
          errBox.style.marginTop = '1.25rem';
          errBox.style.textAlign = 'center';
          errBox.innerHTML = '<div style="font-size:0.85rem;color:#4b5563;margin-bottom:0.75rem;direction:rtl;">استغرق التحميل وقتاً أطول من المعتاد...</div><button onclick="window.clearAppCacheAndReload()" style="background:#059669;color:#fff;border:none;padding:0.5rem 1.15rem;border-radius:9999px;font-weight:700;font-size:0.8rem;cursor:pointer;">تحديث وحذف الذاكرة المؤقتة • Reload</button>';
          const content = document.querySelector('.splash-content');
          if (content) content.appendChild(errBox);
        }
      }
    }, 8000);
  </script>
