name: 05 - Build & Deploy Web App

on:
  push:
    branches:
      - main
      - 'ReciteQuran-*'
      - 'ReciteQuran-الحمدلله'
    paths:
      - 'web/**'
      - 'landing_page/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/04_deploy_web.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Flutter Web & Landing Page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Create asset placeholder for Web
        run: |
          mkdir -p assets/model
          touch assets/model/zipformer_p_arabic_v3.int8.onnx

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/recite/"

      - name: Prepare Landing Page with Flutter Web App
        env:
          SUBHAN_ALLAH: ${{ secrets.SUBHAN_ALLAH }}
        run: |
          mkdir -p landing_page/recite
          cp -R build/web/* landing_page/recite/
          mkdir -p functions landing_page/functions
          cp web/download-model.js functions/download-model.js
          cp web/download-model.js landing_page/functions/download-model.js
          if [ -n "${SUBHAN_ALLAH}" ]; then
            sed -i "s/INJECT_TOKEN_HERE/${SUBHAN_ALLAH}/g" functions/download-model.js 2>/dev/null || true
            sed -i "s/INJECT_TOKEN_HERE/${SUBHAN_ALLAH}/g" landing_page/functions/download-model.js 2>/dev/null || true
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy landing_page --project-name=recitequran
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
