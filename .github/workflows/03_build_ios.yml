name: 03 - Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_ios:
    name: Build iOS (Unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create assets directory
        run: mkdir -p assets/model

      - name: Download Model from GitHub Cache (models-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download models-latest -p "*.onnx" --dir assets/model

      - name: Build iOS Archive (No Codesign)
        run: flutter build ipa --release --no-codesign

      - name: Create unsigned IPA payload
        run: |
          mkdir -p Payload
          mv build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r ReciteQuran_unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recite-quran-ios-unsigned
          path: ReciteQuran_unsigned.ipa
          retention-days: 7
